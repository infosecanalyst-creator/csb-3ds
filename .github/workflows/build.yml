name: build-3dsx
# Builds csb3ds.3dsx (DM1, CSB and fan dungeons) with devkitARM and publishes it with the build
# log to the `builds` branch, for emulator testing and Wi-Fi install without a local build.
on:
  push:
    branches: ["**", "!builds"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - name: Tools
        run: |
          apt-get update -qq
          apt-get install -y -qq git make python3 cmake ca-certificates >/dev/null
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
      - name: Build
        run: bash build.sh 2>&1 | tee build.log; test -f out/csb3ds.3dsx
      - name: Collect
        if: always()
        run: |
          mkdir -p pub
          cp out/* pub/ 2>/dev/null || true
          cp build.log pub/ 2>/dev/null || true
          echo "$GITHUB_SHA" > pub/SOURCE_COMMIT
          rm -rf out-keep && mv out out-keep 2>/dev/null || true
          mv pub out
      - name: Publish to builds branch
        if: always()
        run: |
          cd out
          git init -q -b builds
          git config user.name "build-bot"; git config user.email "build-bot@users.noreply.github.com"
          git add -A; git commit -qm "build of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds
